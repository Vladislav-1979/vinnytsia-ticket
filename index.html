<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Vinnytsia Ticket</title>
  <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    #countdown { font-size: 24px; margin: 10px; }
    .info-phone { color:#4EA524; }
    .info-text { color:#ffffff; }
  </style>
</head>
<body>
  <h1>Архів</h1>
  <div id="countdown"></div>
  <div id="block3"></div>
  <div id="block4"></div>

  <h2>Екран інформації</h2>
  <div>
    <span class="info-phone">0 800 50 14 86</span>
    <span class="info-text">(текст у дужках)</span>
  </div>

  <button onclick="startScanner()">Сканувати QR-kode</button>
  <div id="reader" style="width:300px"></div>

  <script>
    // Таймер до 00:00
    function updateCountdown() {
      const now = new Date();
      const midnight = new Date();
      midnight.setHours(24,0,0,0);
      const diff = midnight - now;
      const h = Math.floor(diff / 1000 / 60 / 60);
      const m = Math.floor((diff / 1000 / 60) % 60);
      const s = Math.floor((diff / 1000) % 60);
      document.getElementById("countdown").textContent =
        `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Генерация времени
    function randomTime() {
      const h = Math.floor(Math.random() * 15) + 7; // 7–21
      const m = Math.floor(Math.random() * 60);
      const s = Math.floor(Math.random() * 60);
      return new Date(2020,0,1,h,m,s); // дата не важна
    }

    function generateBlocks() {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);

      const topTime = randomTime();
      const bottomTime = new Date(topTime.getTime() - (60+Math.floor(Math.random()*30))*60000);

      document.getElementById("block3").textContent =
        `Дата: ${yesterday.toLocaleDateString()} Час: ${topTime.toTimeString().split(" ")[0]}`;
      document.getElementById("block4").textContent =
        `Дата: ${yesterday.toLocaleDateString()} Час: ${bottomTime.toTimeString().split(" ")[0]}`;
    }
    generateBlocks();

    // QR Scanner
    function startScanner() {
      const scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        qrCodeMessage => {
          alert(`QR знайдено: ${qrCodeMessage}`);
          scanner.stop();
        },
        errorMessage => {
          console.log("Помилка сканування", errorMessage);
        }
      );
    }
  </script>
</body>
</html>
